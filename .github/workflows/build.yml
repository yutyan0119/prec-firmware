name: Build PREC firmware

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same QMK CLI image as the pinned Vial-QMK revision's CI.
    container: ghcr.io/qmk/qmk_cli@sha256:16c4916e95b99bf88d27b15aec8db409ee17265d1710287fde248c6666508966
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Prepare matching sources
        run: bash tools/prepare-source.sh .build/vial-qmk
      - name: Build Vial firmware
        run: make -C .build/vial-qmk -j2 prec:vial
      - name: Collect firmware and source reference
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
        run: |
          mkdir dist
          install -m 644 .build/vial-qmk/prec_vial.bin dist/prec_vial.bin
          install -m 644 LICENSE dist/LICENSE
          printf 'PREC source and build scripts: %s\nVial-QMK base: https://github.com/vial-kb/vial-qmk/tree/%s\n' "$SOURCE_URL" "$(cat firmware/vial-qmk-revision)" > dist/SOURCE.txt
          cd dist && sha256sum prec_vial.bin > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prec-vial
          path: dist/
          if-no-files-found: error
